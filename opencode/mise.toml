[tools]
"aqua:BurntSushi/ripgrep" = "15.2.0"
node = "26.13.0"
go = "1.27.3"
npm = "12.2.1"

# LSP servers (managed by mise so OpenCode can find them on PATH)
"go:golang.org/x/tools/gopls" = "0.24.0"
#"npm:@vue/language-server" = "3.3.14"
"npm:typescript-language-server" = "6.0.3"
"npm:yaml-language-server" = "2.0.0"

[tasks.opencode]
description = "Start the OpenCode instance for one user."
dir = "{{ env.HOME }}"
run = 'exec opencode web --hostname 127.0.0.1 --port "$OPENCODE_PORT"'
quiet = true
deny_env = true
allow_env = [
  "OPENCODE_USERNAME",
  "OPENCODE_PORT",
  "OPENCODE_CONFIG_CONTENT",
  "OPENCODE_SERVER_PASSWORD",
  "OPENCODE_SERVER_USERNAME",
  "OPENCODE_PUBLIC_URL",
  "OPENCODE_INGRESS_PATH",
  "OPENCODE_DISABLE_AUTOUPDATE",
  "XDG_CONFIG_HOME",
  "XDG_DATA_HOME",
  "XDG_CACHE_HOME",
  "XDG_STATE_HOME",
  "TMPDIR",
]

[tasks.opencode.env]
OPENCODE_DISABLE_AUTOUPDATE = "true"
